    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e141b" />
    <script>
      // Resolve the theme before first paint to avoid a flash of the wrong
      // scheme: a stored manual choice wins, otherwise follow the OS.
      // src/lib/theme.js reads the same key with the same precedence and keeps
      // it in sync while the page is open — change the two together.
      (function () {
        var stored = null;
        try {
          stored = window.localStorage.getItem('codexr:theme');
        } catch (error) {
          stored = null;
        }
        var isDark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
