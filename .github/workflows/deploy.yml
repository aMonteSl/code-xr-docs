name: Deploy Code-XR Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Vite app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify custom domain file
        run: |
          echo "Checking generated CNAME..."
          test -f dist/CNAME
          cat dist/CNAME