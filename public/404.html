<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 · Page not found | Code-XR</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#020711" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: 'Inter', 'Poppins', 'Roboto', system-ui, sans-serif;
        line-height: 1.6;
        color: #ffffff;
        background-color: #010204;
        background-image:
          radial-gradient(circle at top, rgba(0, 170, 255, 0.07), transparent 26%),
          linear-gradient(rgba(0, 170, 255, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 170, 255, 0.02) 1px, transparent 1px),
          linear-gradient(180deg, rgba(3, 6, 10, 0.97), rgba(2, 4, 8, 0.96) 45%, rgba(0, 0, 0, 0.99) 100%);
        background-size: auto, 50px 50px, 50px 50px, auto;
        background-position: top center, top left, top left, top left;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }

      main {
        max-width: 40rem;
        text-align: center;
      }

      .status {
        font-size: clamp(5rem, 18vw, 9rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
        background: linear-gradient(90deg, #ffffff, #00aaff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: float 3s ease-in-out infinite;
      }

      h1 {
        margin-top: 1.25rem;
        font-size: clamp(1.4rem, 4vw, 2rem);
        font-weight: 700;
      }

      p {
        margin-top: 0.75rem;
        color: #94a3b8;
        font-size: 1.05rem;
      }

      p code {
        color: #33bbff;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 0.95em;
        word-break: break-all;
      }

      .actions {
        margin-top: 2.25rem;
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
      }

      .btn {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 1rem;
        text-decoration: none;
        transition: transform 0.3s, box-shadow 0.3s, background-color 0.3s, color 0.3s;
      }

      .btn-primary {
        background-color: #00aaff;
        color: #ffffff;
        box-shadow: 0 0 20px rgba(0, 170, 255, 0.3);
      }

      .btn-primary:hover {
        background-color: #0088cc;
        transform: scale(1.05);
        box-shadow: 0 0 30px rgba(0, 170, 255, 0.5);
      }

      .btn-secondary {
        border: 2px solid #00aaff;
        color: #00aaff;
      }

      .btn-secondary:hover {
        background-color: #00aaff;
        color: #000000;
        transform: scale(1.05);
      }

      footer {
        margin-top: 3rem;
        font-size: 0.85rem;
        color: #475569;
      }

      footer a {
        color: #64748b;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .status {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status" aria-hidden="true">404</div>
      <h1>This page is outside the scene</h1>
      <p>
        The URL <code id="requested-path"></code> doesn't exist on this site. The page may have
        moved with a release, or the link you followed is broken.
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Back to Code-XR</a>
        <a
          class="btn btn-secondary"
          href="https://github.com/aMonteSl/CodeXR"
          rel="noopener noreferrer"
          >Code-XR on GitHub</a
        >
      </div>
      <footer>
        Think this link should work?
        <a href="https://github.com/aMonteSl/code-xr-docs/issues" rel="noopener noreferrer"
          >Open an issue</a
        >
        and it will get fixed.
      </footer>
    </main>
    <script>
      // Show the path that 404'd; fall back to hiding the sentence fragment cleanly.
      var target = document.getElementById('requested-path');
      target.textContent = window.location.pathname || '/unknown';
    </script>
  </body>
</html>
