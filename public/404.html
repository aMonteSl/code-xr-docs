<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 · Page not found | Code-XR</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafbfc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e141b" />
    <style>
      /* Self-contained on purpose: GitHub Pages serves this without the Vite
         bundle, so it cannot use the Tailwind theme. The token VALUES below are
         copied from src/styles/main.css and are the one sanctioned place in the
         repo for literal hex — keep them in step with it.

         This page used to carry the rejected look wholesale: neon cyan #00aaff,
         glow shadows, scale-on-hover, a 50px grid backdrop and a floating
         headline. It is the page a broken inbound link lands on, so it is the
         worst place to contradict the rest of the site. */
      :root {
        --surface: #fafbfc;
        --surface-raised: #f2f4f7;
        --ink: #1c2733;
        --ink-muted: #4c5b6b;
        --ink-faint: #8593a3;
        --edge: #dbe1e8;
        --accent: #35618e;
        --accent-strong: #274b70;
        --on-accent: #ffffff;
        --shadow-card: 0 1px 2px rgb(28 39 51 / 0.04), 0 8px 24px -12px rgb(28 39 51 / 0.12);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #0e141b;
          --surface-raised: #151d26;
          --ink: #e6ebf0;
          --ink-muted: #a3b1bf;
          --ink-faint: #66778a;
          --edge: #26313e;
          --accent: #7ba7cc;
          --accent-strong: #9dbfda;
          --on-accent: #0e141b;
          --shadow-card: 0 1px 2px rgb(0 0 0 / 0.4), 0 10px 30px -16px rgb(0 0 0 / 0.5);
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: 'Inter Variable', 'Inter', system-ui, sans-serif;
        line-height: 1.6;
        color: var(--ink);
        background-color: var(--surface);
        /* The sanctioned backdrop: one restrained vertical gradient. No grid,
           no halo, painted once. */
        background-image: linear-gradient(to bottom, var(--surface-raised), var(--surface) 60%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }

      main {
        max-width: 40rem;
        text-align: center;
      }

      /* Weight and scale carry it, not a hue and not motion. */
      .status {
        font-size: clamp(5rem, 18vw, 9rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
        color: var(--ink-faint);
      }

      h1 {
        margin-top: 1.25rem;
        font-size: clamp(1.4rem, 4vw, 2rem);
        font-weight: 700;
        text-wrap: balance;
      }

      p {
        margin-top: 0.75rem;
        color: var(--ink-muted);
        font-size: 1.05rem;
        text-wrap: pretty;
      }

      p code {
        color: var(--accent-strong);
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 0.95em;
        word-break: break-all;
      }

      @media (prefers-color-scheme: dark) {
        p code {
          color: var(--accent);
        }
      }

      .actions {
        margin-top: 2.25rem;
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
      }

      /* Mirrors components/ui/Button: 2px border on every variant so the two
         match in height, colour-only hover, 44px minimum target. */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0.75rem 1.5rem;
        border: 2px solid transparent;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 1rem;
        text-decoration: none;
        transition: background-color 0.3s, border-color 0.3s, color 0.3s;
      }

      @media (prefers-reduced-motion: reduce) {
        .btn {
          transition: none;
        }
      }

      .btn-primary {
        background-color: var(--accent);
        color: var(--on-accent);
      }

      .btn-primary:hover {
        background-color: var(--accent-strong);
      }

      .btn-secondary {
        border-color: var(--accent);
        color: var(--accent-strong);
      }

      @media (prefers-color-scheme: dark) {
        .btn-secondary {
          color: var(--accent);
        }
      }

      .btn-secondary:hover {
        background-color: var(--accent);
        color: var(--on-accent);
      }

      /* One focus style for the page, matching the site's global rule. */
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      footer {
        margin-top: 3rem;
        font-size: 0.85rem;
        color: var(--ink-muted);
      }

      footer a {
        color: var(--accent-strong);
        text-underline-offset: 4px;
      }

      @media (prefers-color-scheme: dark) {
        footer a {
          color: var(--accent);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status" aria-hidden="true">404</div>
      <h1>This page is outside the scene</h1>
      <p>
        The URL <code id="requested-path"></code> doesn't exist on this site. The page may have
        moved with a release, or the link you followed is broken.
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Back to Code-XR</a>
        <a
          class="btn btn-secondary"
          href="https://github.com/aMonteSl/CodeXR"
          rel="noopener noreferrer"
          >Code-XR on GitHub</a
        >
      </div>
      <footer>
        Think this link should work?
        <a href="https://github.com/aMonteSl/code-xr-docs/issues" rel="noopener noreferrer"
          >Open an issue</a
        >
        and it will get fixed.
      </footer>
    </main>
    <script>
      // Show the path that 404'd; fall back to hiding the sentence fragment cleanly.
      var target = document.getElementById('requested-path');
      target.textContent = window.location.pathname || '/unknown';
    </script>
  </body>
</html>
