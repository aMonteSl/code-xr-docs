<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Directory Analysis: express</title>
    <meta name="description" content="Data visualization with BabiaXR">
    <!-- A-Frame Core -->
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

    <!-- A-Frame Extras (v7.5.4: añade compatibilidad con gamepad-controls para 1.7.0+) -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script> 

    <!-- Babia -->
    <script src="https://unpkg.com/aframe-babia-components@1.3.4/dist/aframe-babia-components.min.js"></script>

    <!-- Environment Component (v1.5.0: última publicada) -->
    <script src="https://unpkg.com/aframe-environment-component@1.5.0/dist/aframe-environment-component.min.js"></script>

    <!-- Geometry Merger Component (v2.0.1: última publicada) -->
    <script src="https://unpkg.com/aframe-geometry-merger-component@2.0.1/dist/aframe-geometry-merger-component.min.js"></script> 
    
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
</head>
<body>
    <a-scene id="scene"
    light="defaultLightsEnabled: false"
    background="color: #FFFFFF"
    xr-mode-ui="enabled: true; XRMode: xr"
    device-orientation-permission-ui>

        
        <!-- Environment -->
        <a-entity id="env" environment="preset: default; groundColor: #000000" hide-on-enter-ar></a-entity>

        <!-- CodeXR room (kept independent from environment preset) -->
        <a-entity
            id="codexrRoom"
            position="0 0 -10"
            hide-on-enter-ar
            codexr-room="
                width: 22;
                depth: 26;
                height: 11;
                openSide: south;
                wallTexture: ./assets/codexr/xr-room/textures/wall.svg;
                floorTexture: ./assets/codexr/xr-room/textures/floor.svg;
                ceilingTexture: ./assets/codexr/xr-room/textures/ceiling.svg;
                railingTexture: ./assets/codexr/xr-room/textures/railing.svg;
                glassRailing: true;
                glassRailingOpacity: 0.34;
                glassRailingTint: #d7ecff;
            ">
        </a-entity>

        <a-entity
            id="codexrScreenManager"
            codexr-multi-screen-manager="maxScreens: 5; wall: west"
            position="0 0 0">
        </a-entity>

        <!-- Light -->
        <a-entity light="color: #fff; type:ambient; intensity: 0.85"></a-entity>
        
        <!-- Data -->
        <a-entity id="data" babia-queryjson="url: data.json"></a-entity>
        
        <!-- Tree Structure (Only for boats charts) -->
        <a-entity id="tree" babia-treebuilder="field: filePath; split_by: /; from: data"></a-entity>

        <!-- Chart Component (Dynamic) -->
        <!-- Boats Chart -->
                <a-entity id="chart"
                    babia-boats="from: tree;
                                 title: Directory Analysis: express;
                                 legend: true;
                                 legend_text: {name}
{fheight} (height): {height}
{farea} (area): {area}
{fcolor} (color): {color};
                                 height_building_legend: -0.5;
                                 legend_scale: 0.25;
                                 legend_lookat: [laser-controls];
                                 palette: ubuntu;
                                 area: functionCount;
                                 height: totalLines;
                                 color: cyclomaticComplexityNumber;
                                 axis_name: true;
                                 extra: 1;
                                 separation: 0.5;
                                 zone_elevation: 0.01;
                                 height_quarter_legend_box: 0.01;
                                 height_quarter_legend_title: 2.5"
                    codexr-chart-pedestal="enabled: true;
                                           anchorX: 0;
                                           anchorY: 1;
                                           anchorZ: -18;
                                           uiDockEnabled: false;
                                           targetWidth: 5.614;
                                           targetHeight: 1.8;
                                           targetDepth: 3.218;
                                           bootstrapPlanarMaxRatio: 0.84;
                                           minPlanarOccupancyRatio: 1.3;
                                           maxPlanarOccupancyRatio: 1.35;
                                           minHeightOccupancyRatio: 0.45;
                                           heightBandMinRatio: 0.38;
                                           heightBandMaxRatio: 0.72;
                                           tableEdgeMargin: 0.18;
                                           yScaleMin: 0.01;
                                           yScaleMax: 4;
                                           containmentToleranceRatio: 0.018;
                                           periodicContainmentEnabled: false;
                                           stabilizationCheckMs: 140;
                                           stabilizationMaxChecks: 14;
                                           stabilizationStablePasses: 3"
                    position="0 1 -18"
                    rotation="0 0 0"
                    scale="0.01 0.05 0.01"
                    class="babiaxraycasterclass">
                </a-entity>

        <!-- Babia UI panel and toggle (optional) -->
        

        <a-entity id="rig" movement-controls="fly: false" position="0.07 1.75 -10.75">
        <!-- Cámara -->
        <a-entity camera position="0 0 0" look-controls></a-entity>

        <!-- Mando izquierdo SIN raycaster (solo visual) -->
        <a-entity
        id="leftController"
        laser-controls="hand: left"
        meta-touch-controls="hand: left; model: true"
        daydream-controls="hand: left"
        gearvr-controls="hand: left"
        hp-mixed-reality-controls="hand: left"
        magicleap-controls="hand: left"
        oculus-go-controls="hand: left"
        valve-index-controls="hand: left"
        vive-controls="hand: left"
        vive-focus-controls="hand: left"
        windows-motion-controls="hand: left"
        generic-tracked-controller-controls="hand: left">
        </a-entity>

        <!-- Mando derecho CON raycaster (SOLO este interactúa) -->
        <a-entity
        id="rightController"
        laser-controls="hand: right"
        meta-touch-controls="hand: right; model: true"
        daydream-controls="hand: right"
        gearvr-controls="hand: right"
        hp-mixed-reality-controls="hand: right"
        magicleap-controls="hand: right"
        oculus-go-controls="hand: right"
        valve-index-controls="hand: right"
        vive-controls="hand: right"
        vive-focus-controls="hand: right"
        windows-motion-controls="hand: right"
        generic-tracked-controller-controls="hand: right"
        cursor="rayOrigin: entity; fuse: false"
        raycaster="objects: .babiaxraycasterclass; far: 100; showLine: true; lineColor: blue; lineOpacity: 0.5">
        </a-entity>

        <!-- Cursor para interacción con ratón -->
        <a-entity 
        cursor="rayOrigin: mouse"
        raycaster="objects: .babiaxraycasterclass; far: 100">
        </a-entity>
        </a-entity>
    </a-scene>

    <script id="codexr-tooling-config-virtual-screen" type="application/json">{"enabled":true,"broadcastEnabled":true,"signalingPath":"/codexr-broadcast","sceneSelector":"#scene","followAnchorSelector":"#rig","anchoredPosition":{"x":0,"y":5,"z":-22},"anchoredRotation":{"x":-12,"y":0,"z":0},"followOffset":{"x":0,"y":0.8,"z":-2.4},"followRotation":{"x":0,"y":0,"z":0}}</script>
<script nonce="d084ba909ddcf3d4296ce668d0893149" src="./codexrCollaborationRuntime.js"></script>
<script nonce="d084ba909ddcf3d4296ce668d0893149" src="./virtualScreenRuntime.js"></script>
<script nonce="d084ba909ddcf3d4296ce668d0893149" src="./codexrMultiScreenManagerRuntime.js"></script>
<script nonce="d084ba909ddcf3d4296ce668d0893149" src="./codexrRoomRuntime.js"></script>
<script nonce="d084ba909ddcf3d4296ce668d0893149" src="./xrChartMappingUiRuntime.js"></script>
<script nonce="d084ba909ddcf3d4296ce668d0893149" src="./xrChartDebugRuntime.js"></script>
<script nonce="d084ba909ddcf3d4296ce668d0893149" src="./chartPedestalRuntime.js"></script>

</body>
</html>
