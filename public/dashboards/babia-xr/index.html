<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
    <meta charset="utf-8">
    <title>Directory Analysis: aframe-babia-components</title>
    <meta name="description" content="Data visualization with BabiaXR">
    <!-- A-Frame Core -->
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

    <!-- A-Frame Extras (v7.5.4: añade compatibilidad con gamepad-controls para 1.7.0+) -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script> 

    <!-- Babia -->
    <script src="https://unpkg.com/aframe-babia-components@1.3.4/dist/aframe-babia-components.min.js"></script>

    <!-- Environment Component (v1.5.0: última publicada) -->
    <script src="https://unpkg.com/aframe-environment-component@1.5.0/dist/aframe-environment-component.min.js"></script>

    <!-- Geometry Merger Component (v2.0.1: última publicada) -->
    <script src="https://unpkg.com/aframe-geometry-merger-component@2.0.1/dist/aframe-geometry-merger-component.min.js"></script> 
    
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
</head>
<body>
    <a-scene id="scene"
    light="defaultLightsEnabled: false"
    background="color: #FFFFFF"
    xr-mode-ui="enabled: true; XRMode: xr"
    codexr-pointer-policy
    device-orientation-permission-ui>

        
        <!-- Environment -->
        <a-entity id="env" environment="preset: default; groundColor: #000000" hide-on-enter-ar></a-entity>

        <!-- CodeXR room (kept independent from environment preset) -->
        <a-entity
            id="codexrRoom"
            position="0 0 -10"
            hide-on-enter-ar
            codexr-room="
                width: 22;
                depth: 26;
                height: 11;
                openSide: south;
                wallTexture: ./assets/codexr/xr-room/textures/wall.svg;
                floorTexture: ./assets/codexr/xr-room/textures/floor.svg;
                ceilingTexture: ./assets/codexr/xr-room/textures/ceiling.svg;
                railingTexture: ./assets/codexr/xr-room/textures/railing.svg;
                glassRailing: true;
                glassRailingOpacity: 0.34;
                glassRailingTint: #d7ecff;
            ">
        </a-entity>

        <a-entity
            id="codexrScreenManager"
            codexr-multi-screen-manager="maxScreens: 5; wall: west"
            position="0 0 0">
        </a-entity>

        <!-- Light. The environment component parents its own hemisphere +
             directional lights under #env, which is hidden in AR — this
             ambient plus the AR fill below are the only lights that survive
             there. The fill idles at 0 and codexr-ar-fill-light raises it for
             AR sessions only, so desktop and VR keep their exact look. -->
        <a-entity light="color: #fff; type:ambient; intensity: 0.85"></a-entity>
        <a-entity codexr-ar-fill-light
        light="type: directional; color: #ffffff; intensity: 0"
        position="1 4 2"></a-entity>
        
        <!-- Data -->
        <a-entity id="data" babia-queryjson="url: data.json"></a-entity>
        
        <!-- Analysis table and owned visualization surface -->
        <a-entity
            id="codexrAnalysisTable"
            codexr-analysis-table="mode: single; width: 6.514; depth: 4.118; anchorX: 0; anchorY: 1; anchorZ: -18">
        </a-entity>
        <!-- Brand mark over the table while no analysis is loaded. Decoration
             only: it carries no raycaster class, and it lives outside the
             analysis surface so the selection sweep never owns it. -->
        <a-entity
            id="codexrBrandLogo"
            data-codexr-role="brand-logo auxiliary"
            codexr-logo="anchorX: 0; anchorY: 1.62; anchorZ: -18; width: 1.8">
        </a-entity>
        <a-entity
            id="codexrAnalysisSurface"
            data-codexr-analysis-surface="true">
            <a-entity
                id="codexrNormalAnalysisRoot"
                data-codexr-analysis-root="true"
                data-codexr-analysis-mode="single"
                data-codexr-normal-root="true">
                <!-- Tree Structure (Only for boats charts) -->
                <a-entity id="tree" babia-treebuilder="field: filePath; split_by: /; from: data"></a-entity>

                <!-- Chart Component (Dynamic) -->
                <!-- Boats Chart -->
                <a-entity id="chart"
                    data-codexr-active-chart-id="boats"
                    babia-boats="from: tree;
                                 title: Directory Analysis: aframe-babia-components;
                                 palette: ubuntu;
                                 area: functionCount;
                                 height: totalLines;
                                 color: cyclomaticComplexityNumber;
                                 legend: true;
                                 legend_text: {name}
{fheight} (height): {height}
{farea} (area): {area}
{fcolor} (color): {color};
                                 height_building_legend: -0.5;
                                 legend_scale: 0.25;
                                 legend_lookat: [camera];
                                 axis_name: true;
                                 extra: 1;
                                 separation: 0.5;
                                 zone_elevation: 0.01;
                                 height_quarter_legend_box: 0.01;
                                 height_quarter_legend_title: 2.5"
                    codexr-boats-layout-stability="enabled: true"
                    codexr-chart-containment="enabled: true;
                                           anchorX: 0;
                                           anchorY: 1;
                                           anchorZ: -18;
                                           tableTopPadding: 0.9;
                                           targetWidth: 5.614;
                                           targetHeight: 1.8;
                                           targetDepth: 3.218;
                                           bootstrapPlanarMaxRatio: 0.84;
                                           minPlanarOccupancyRatio: 0.78;
                                           maxPlanarOccupancyRatio: 0.92;
                                           heightBandMinRatio: 0.38;
                                           heightBandMaxRatio: 0.72;
                                           tableEdgeMargin: 0.18;
                                           yScaleMin: 0.01;
                                           yScaleMax: 12;
                                           containmentToleranceRatio: 0.018;
                                           periodicContainmentEnabled: true;
                                           stabilizationCheckMs: 140;
                                           stabilizationMaxChecks: 14;
                                           stabilizationStablePasses: 3;
                                           transformTransitionMs: 650;
                                           hardHeightGuardEnabled: true"
                    position="0 1 -18"
                    rotation="0 0 0"
                    scale="0.01 0.05 0.01">
                </a-entity>
            </a-entity>
        </a-entity>

        <!-- Babia UI panel and toggle (optional) -->
        

        <!-- Eye height lives on the RIG, never on the camera. WebXR only ever
             touches the CAMERA entity's local transform (look-controls zeroes
             it when a real session starts, restores it on exit) — the rig's
             position is its own and survives any enter-vr/exit-vr untouched.
             That is what keeps you standing at the same height in the browser,
             in VR and in AR alike. movement-controls drives the rig with its
             native gamepad support: left stick walks, right stick turns —
             both by quaternion, so there is no Euler-angle math to get wrong.
             codexr-immersive-rig turns on `fly` for the duration of any
             immersive session (see requirement below) and, in AR only,
             recenters the rig next to the pedestal. -->
        <a-entity id="rig" movement-controls="fly: false" position="0.07 1.75 -10.75"
        codexr-immersive-rig="arX: 0.07; arZ: -14.7">
        <!-- Cámara + cursor de mirada (activo SOLO en sesión real sin mandos; lo
             gobierna codexr-pointer-policy). Sin geometría de retícula a
             propósito: el anillo blanco molestaba en el casco y el hover ya se
             ve en el propio contenido. -->
        <a-entity id="head" camera position="0 0 0" look-controls>
            <a-entity
            id="gazeCursor"
            visible="false"
            cursor="rayOrigin: entity; fuse: false"
            raycaster="objects: .babiaxraycasterclass; far: 100; enabled: false">
            </a-entity>
        </a-entity>

        <!-- Both controllers are declared IDENTICALLY, with laser-controls and
             nothing else. It already adds the right per-device component
             (meta-touch-controls, vive-controls, …) itself, and it owns the
             raycaster's origin and direction — which matters: Touch controllers
             are held at an angle to the direction they point (A-Frame rotates
             their model by ~40°), so a hand-written raycaster with no direction
             shoots the ray high above where the controller is aiming.
             codexr-pointer-policy only toggles enabled/objects/showLine on top,
             and hands the pointer to whichever controller you last used. -->
        <a-entity id="leftController" laser-controls="hand: left"></a-entity>
        <a-entity id="rightController" laser-controls="hand: right"></a-entity>

        <!-- Cursor para interacción con ratón (puntero activo en navegador normal) -->
        <a-entity
        id="mouseCursor"
        cursor="rayOrigin: mouse"
        raycaster="objects: .babiaxraycasterclass; far: 100">
        </a-entity>
        </a-entity>
    </a-scene>
